[package]
name = "knowledge-bae-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
mcp-server = "0.1"
mcp-spec = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.13.1"
sha2 = "0.11.1"
serde_yaml_ng = "0.10.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
dirs = "7.0.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
