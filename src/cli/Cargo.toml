[package]
name = "knowledge-bae"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
anyhow = "1.0"
regex = "1.13.1"
sha2 = "0.11.1"
serde_yaml_ng = "0.10.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
dirs = "7.0.0"
walkdir = "2.5.0"
fastembed = { version = "7.5.0", default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"

[dev-dependencies]
tempfile = "3.27.0"
